<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Grant Wallet</title>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body data-page="dashboard">
  <div class="app-shell">
    <header class="topbar" id="topbar"></header>
    <div class="app-body">
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
      <nav class="sidebar" id="sidebar"></nav>

      <main class="main-content">
        <div class="page-header">
          <div>
            <h1 class="page-title" data-i18n="dashboard.title">Dashboard</h1>
            <p class="page-subtitle" data-i18n="dashboard.subtitle">Overview of your grant funds and recent activity.</p>
          </div>
          <div class="page-header-actions">
            <span class="last-updated" id="lastUpdated" data-no-translate="true">Last updated: --</span>
            <button class="btn btn-secondary btn-sm" id="refreshBtn" type="button">
              <img src="/assets/icons/refresh.svg" class="icon icon-sm" alt="">
              <span data-i18n="common.refresh">Refresh</span>
            </button>
          </div>
        </div>

        <div class="summary-grid" id="summaryCards"></div>

        <section class="card activity-card">
          <h2 class="section-title" data-i18n="dashboard.recentActivity">Recent activity</h2>
          <div id="activityList" class="activity-list"></div>
        </section>
      </main>
    </div>
  </div>

  <div id="toast-root" class="toast-root"></div>

  <script src="/js/translations.js"></script>
  <script src="/js/translator.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navigation.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
