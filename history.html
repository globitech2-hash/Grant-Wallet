<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History — Grant Wallet</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body data-page="history">
  <div class="app-shell">
    <header class="topbar" id="topbar"></header>
    <div class="app-body">
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
      <nav class="sidebar" id="sidebar"></nav>

      <main class="main-content">
        <div class="page-header">
          <div>
            <h1 class="page-title" data-i18n="history.title">Grant history</h1>
            <p class="page-subtitle" data-i18n="history.subtitle">All grant applications submitted under your account.</p>
          </div>
        </div>

        <div class="filter-tabs" role="tablist">
          <button class="filter-tab is-active" data-filter="all" type="button" data-i18n="history.filterAll">All</button>
          <button class="filter-tab" data-filter="approved" type="button" data-i18n="history.filterApproved">Approved</button>
          <button class="filter-tab" data-filter="not-approved" type="button" data-i18n="history.filterNotApproved">Not approved</button>
        </div>

        <div class="history-toolbar">
          <div class="search-field">
            <img src="assets/icons/search.svg" class="icon" alt="">
            <input type="search" id="searchInput" data-i18n-placeholder="history.searchPlaceholder" placeholder="Search by program name">
          </div>
          <span class="result-count" id="resultCount" data-no-translate="true"></span>
        </div>

        <div class="card">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th data-i18n="history.program">Program</th>
                  <th data-i18n="history.date">Date</th>
                  <th data-i18n="history.amount">Amount</th>
                  <th data-i18n="history.net">Net</th>
                  <th data-i18n="history.status">Status</th>
                </tr>
              </thead>
              <tbody id="historyTableBody"></tbody>
            </table>
          </div>
          <div class="history-cards" id="historyCards"></div>
        </div>
      </main>
    </div>
  </div>

  <div id="toast-root" class="toast-root"></div>

  <script src="js/translations.js"></script>
  <script src="js/translator.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/app.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
