<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Grant Wallet</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body data-page="login">
  <div class="auth-shell">
    <div class="auth-topbar">
      <div class="brand" data-no-translate="true">
        <img src="assets/icons/bank.svg" class="icon brand-icon" alt="">
        <span>Grant Wallet</span>
      </div>
      <button class="lang-toggle" id="langToggle" type="button" aria-label="Toggle language">
        <img src="assets/icons/globe.svg" class="icon" alt="">
        <span id="langToggleLabel">EN</span>
      </button>
    </div>

    <div class="auth-card-wrap">
      <div class="card auth-card">
        <h1 class="auth-title" data-i18n="login.title">Log in</h1>
        <p class="auth-subtitle" data-i18n="login.subtitle">Access your grant wallet dashboard.</p>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email" data-i18n="login.email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email" autofocus>
          </div>
          <div class="field">
            <label for="password" data-i18n="login.password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
          </div>
          <div class="form-error" id="loginError" role="alert" hidden></div>
          <button type="submit" class="btn btn-primary btn-block" id="loginSubmit">
            <span data-i18n="login.submit">Log in</span>
          </button>
        </form>

        <p class="auth-footnote">
          <span data-i18n="login.noAccount">Don't have an account?</span>
          <a href="register.html" data-i18n="login.registerLink">Request access</a>
        </p>
      </div>
    </div>
  </div>

  <div id="toast-root" class="toast-root"></div>

  <script src="js/translations.js"></script>
  <script src="js/translator.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
