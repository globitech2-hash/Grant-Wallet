<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request access — Grant Wallet</title>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body data-page="register">
  <div class="auth-shell">
    <div class="auth-topbar">
      <div class="brand" data-no-translate="true">
        <img src="/assets/icons/bank.svg" class="icon brand-icon" alt="">
        <span>Grant Wallet</span>
      </div>
      <button class="lang-toggle" id="langToggle" type="button" aria-label="Toggle language">
        <img src="/assets/icons/globe.svg" class="icon" alt="">
        <span id="langToggleLabel">EN</span>
      </button>
    </div>

    <div class="auth-card-wrap">
      <div class="card auth-card">
        <div class="register-message">
          <img src="/assets/icons/alert.svg" class="icon register-icon" alt="">
          <h1 class="auth-title" data-i18n="register.title">Request access</h1>
          <p class="auth-subtitle" data-i18n="register.subtitle">New account registration</p>
          <p><strong data-i18n="register.message">Not available in your region</strong></p>
          <p class="register-note">Grant Wallet accounts are currently provisioned by program administrators only.</p>
        </div>

        <a href="/login.html" class="btn btn-secondary btn-block" style="margin-top:16px;" data-i18n="register.backToLogin">Back to log in</a>
      </div>
    </div>
  </div>

  <div id="toast-root" class="toast-root"></div>

  <script src="/js/translations.js"></script>
  <script src="/js/translator.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navigation.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
